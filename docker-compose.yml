services:
  app:
    build:
      context: .
    env_file:
      - .env.docker
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build:
      context: .
    env_file:
      - .env.docker
    command: ["/app/migrate", "up"]
    entrypoint: []
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  admin:
    build:
      context: .
    env_file:
      - .env.docker
    entrypoint: []
    command: ["/app/admin", "create", "-username=admin", "-email=admin@local.invalid", "-full-name=Admin", "-password=change_this_password"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: homework
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d homework"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
