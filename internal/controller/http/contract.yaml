openapi: 3.0.3
info:
  title: Homework API
  description: |
    Homework API is a Go backend skeleton project built for practicing a work-style backend architecture.
    It includes Echo routing, PostgreSQL access through GORM, JWT authentication, role/action based access control, Swagger/OpenAPI, email verification, reset password flow, Redis-ready middleware, migrations, and Docker support.

    Backend API: https://be.rizkistarter.com
    Frontend Website: https://rizkistarter.com
    Backend GitHub: https://github.com/rizkiar00/homework
    Frontend GitHub: https://github.com/rizkiar00/homework-fe
  version: 1.0.0
externalDocs:
  description: Backend GitHub Repository
  url: https://github.com/rizkiar00/homework
servers:
  - url: https://be.rizkistarter.com
    description: Production
  - url: /
    description: Current host
paths:
  /health:
    get:
      tags:
        - health
      operationId: GetHealth
      summary: Check application liveness
      responses:
        "200":
          description: Application is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthAPIResponse"
  /readiness:
    get:
      tags:
        - health
      operationId: GetReadiness
      summary: Check application readiness
      responses:
        "200":
          description: Application is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessAPIResponse"
        "503":
          description: Application is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessAPIResponse"
  /auth/register:
    post:
      tags:
        - auth
      operationId: Register
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserAPIResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username or email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/verify-email:
    post:
      tags:
        - auth
      operationId: VerifyEmail
      summary: Verify registered user email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyAPIResponse"
        "400":
          description: Invalid or expired verification code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/resend-verification:
    post:
      tags:
        - auth
      operationId: ResendVerification
      summary: Resend email verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
      responses:
        "200":
          description: Verification code sent if the email is pending verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyAPIResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/forgot-password:
    post:
      tags:
        - auth
      operationId: ForgotPassword
      summary: Request reset password code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Reset password code sent if the email is registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyAPIResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/reset-password:
    post:
      tags:
        - auth
      operationId: ResetPassword
      summary: Reset password with emailed code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyAPIResponse"
        "400":
          description: Invalid request or reset password code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      tags:
        - auth
      operationId: Login
      summary: Login and get access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentialRequest"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginAPIResponse"
        "401":
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      tags:
        - auth
      operationId: Logout
      summary: Logout current access token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyAPIResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      tags:
        - auth
      operationId: GetMe
      summary: Get current user from access token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserAPIResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /actions:
    get:
      tags:
        - access
      operationId: GetActions
      summary: Get all available API actions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Action list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionListAPIResponse"
  /roles:
    post:
      tags:
        - access
      operationId: CreateRole
      summary: Create role and optional access mapping
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAPIResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /roles/{role_id}:
    put:
      tags:
        - access
      operationId: UpdateRole
      summary: Update role and optional access mapping
      security:
        - bearerAuth: []
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAPIResponse"
        "404":
          description: Role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /roles/{role_id}/actions:
    put:
      tags:
        - access
      operationId: SetRoleActions
      summary: Replace action mapping for a role
      security:
        - bearerAuth: []
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRoleActionsRequest"
      responses:
        "200":
          description: Role actions updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAPIResponse"
        "404":
          description: Role or action not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/{user_id}/role:
    put:
      tags:
        - access
      operationId: AssignUserRole
      summary: Assign a role to a user
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignUserRoleRequest"
      responses:
        "200":
          description: User role assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyAPIResponse"
        "404":
          description: User or role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /test_db:
    post:
      tags:
        - test_db
      operationId: CreateTestDB
      summary: Create test table row
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestDBRequest"
      responses:
        "201":
          description: Row created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestDBAPIResponse"
    get:
      tags:
        - test_db
      operationId: GetTestDBList
      summary: Get all test table rows
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number, starts from 1.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Number of rows per page.
        - name: order_by
          in: query
          required: false
          schema:
            type: string
            enum:
              - test_id
              - desc_test
            default: test_id
          description: Column used for sorting.
        - name: order_dir
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
          description: Sort direction.
      responses:
        "200":
          description: Paginated row list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestDBListResponse"
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /test_db/{test_id}:
    get:
      tags:
        - test_db
      operationId: GetTestDBByID
      summary: Get test table row by id
      security:
        - bearerAuth: []
      parameters:
        - name: test_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Row detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestDBAPIResponse"
        "404":
          description: Row not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - test_db
      operationId: UpdateTestDB
      summary: Update test table row
      security:
        - bearerAuth: []
      parameters:
        - name: test_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestDBRequest"
      responses:
        "200":
          description: Row updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestDBAPIResponse"
        "404":
          description: Row not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - test_db
      operationId: DeleteTestDB
      summary: Delete test table row
      security:
        - bearerAuth: []
      parameters:
        - name: test_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Row deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyAPIResponse"
        "404":
          description: Row not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required:
        - full_name
        - username
        - email
        - password
      properties:
        full_name:
          type: string
          example: Rizki Achmad
        username:
          type: string
          example: rizki
        email:
          type: string
          format: email
          example: rizki@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: secret123
    AuthCredentialRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: rizki
        password:
          type: string
          format: password
          minLength: 8
          example: secret123
    VerifyEmailRequest:
      type: object
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
          example: rizki@example.com
        code:
          type: string
          minLength: 6
          maxLength: 6
          example: "482193"
    ResendVerificationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: rizki@example.com
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: rizki@example.com
    ResetPasswordRequest:
      type: object
      required:
        - email
        - code
        - new_password
      properties:
        email:
          type: string
          format: email
          example: rizki@example.com
        code:
          type: string
          minLength: 6
          maxLength: 6
          example: "482193"
        new_password:
          type: string
          format: password
          minLength: 8
          example: newSecret123
    AuthUserResponse:
      type: object
      required:
        - user_id
        - username
        - role
      properties:
        user_id:
          type: string
          format: uuid
        full_name:
          type: string
          example: Rizki Achmad
        username:
          type: string
          example: rizki
        email:
          type: string
          format: email
          example: rizki@example.com
        role:
          type: string
          example: user
    AuthUserAPIResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/AuthUserResponse"
    LoginResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
    LoginAPIResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/LoginResponse"
    ActionResponse:
      type: object
      required:
        - action_id
        - action_desc
        - action_type
        - endpoint
      properties:
        action_id:
          type: integer
          format: int64
          example: 1
        action_desc:
          type: string
          example: Get test DB list
        action_type:
          type: string
          example: GET
        endpoint:
          type: string
          example: /test_db
    ActionListAPIResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: success
        data:
          type: array
          items:
            $ref: "#/components/schemas/ActionResponse"
    CreateRoleRequest:
      type: object
      required:
        - role_desc
      properties:
        role_desc:
          type: string
          example: admin
        action_ids:
          type: array
          items:
            type: integer
            format: int64
          example:
            - 1
            - 2
    UpdateRoleRequest:
      type: object
      properties:
        role_desc:
          type: string
          example: operator
        is_active:
          type: boolean
          example: true
        action_ids:
          type: array
          items:
            type: integer
            format: int64
          example:
            - 1
            - 2
    SetRoleActionsRequest:
      type: object
      required:
        - action_ids
      properties:
        action_ids:
          type: array
          items:
            type: integer
            format: int64
          example:
            - 1
            - 2
    AssignUserRoleRequest:
      type: object
      required:
        - role_id
      properties:
        role_id:
          type: integer
          format: int64
          example: 1
    RoleResponse:
      type: object
      required:
        - role_id
        - role_desc
        - is_active
      properties:
        role_id:
          type: integer
          format: int64
          example: 1
        role_desc:
          type: string
          example: admin
        is_active:
          type: boolean
          example: true
        action_ids:
          type: array
          items:
            type: integer
            format: int64
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ActionResponse"
    RoleAPIResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/RoleResponse"
    HealthResponse:
      type: object
      required:
        - status
        - service
        - env
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: homework
        env:
          type: string
          example: local
    ReadinessResponse:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          example: ready
        checks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ReadinessCheck"
    ReadinessCheck:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ready
        message:
          type: string
          example: database configuration is present
    HealthAPIResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/HealthResponse"
    ReadinessAPIResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/ReadinessResponse"
    TestDBRequest:
      type: object
      properties:
        desc_test:
          type: string
          nullable: true
    TestDBResponse:
      type: object
      required:
        - test_id
      properties:
        test_id:
          type: string
          format: uuid
        desc_test:
          type: string
          nullable: true
    TestDBAPIResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/TestDBResponse"
    TestDBListResponse:
      type: object
      required:
        - code
        - message
        - data
        - meta
      properties:
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: success
        data:
          type: array
          items:
            $ref: "#/components/schemas/TestDBResponse"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    PaginationMeta:
      type: object
      required:
        - page
        - limit
        - total
        - total_pages
        - order_by
        - order_dir
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          format: int64
          example: 25
        total_pages:
          type: integer
          example: 3
        order_by:
          type: string
          example: test_id
        order_dir:
          type: string
          example: asc
    EmptyAPIResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: deleted
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: ERR_BAD_REQUEST
        message:
          type: string
          example: invalid request body
