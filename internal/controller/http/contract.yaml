openapi: 3.0.3
info:
  title: Homework API
  version: 1.0.0
paths:
  /health:
    get:
      tags:
        - health
      operationId: GetHealth
      summary: Check application liveness
      responses:
        "200":
          description: Application is alive
  /readiness:
    get:
      tags:
        - health
      operationId: GetReadiness
      summary: Check application readiness
      responses:
        "200":
          description: Application is ready
        "503":
          description: Application is not ready
  /test_db:
    post:
      tags:
        - test_db
      operationId: CreateTestDB
      summary: Create test table row
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestDBRequest"
      responses:
        "201":
          description: Row created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestDBResponse"
    get:
      tags:
        - test_db
      operationId: GetTestDBList
      summary: Get all test table rows
      responses:
        "200":
          description: Row list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TestDBResponse"
  /test_db/{id_test}:
    get:
      tags:
        - test_db
      operationId: GetTestDBByID
      summary: Get test table row by id
      parameters:
        - name: id_test
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Row detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestDBResponse"
        "404":
          description: Row not found
    put:
      tags:
        - test_db
      operationId: UpdateTestDB
      summary: Update test table row
      parameters:
        - name: id_test
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestDBRequest"
      responses:
        "200":
          description: Row updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestDBResponse"
        "404":
          description: Row not found
    delete:
      tags:
        - test_db
      operationId: DeleteTestDB
      summary: Delete test table row
      parameters:
        - name: id_test
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Row deleted
        "404":
          description: Row not found
components:
  schemas:
    TestDBRequest:
      type: object
      properties:
        desc_test:
          type: string
          nullable: true
    TestDBResponse:
      type: object
      required:
        - id_test
      properties:
        id_test:
          type: string
          format: uuid
        desc_test:
          type: string
          nullable: true
