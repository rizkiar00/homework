openapi: 3.0.3
info:
  title: Homework API
  version: 1.0.0
servers:
  - url: /
paths:
  /health:
    get:
      tags:
        - health
      operationId: GetHealth
      summary: Check application liveness
      responses:
        "200":
          description: Application is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthAPIResponse"
  /readiness:
    get:
      tags:
        - health
      operationId: GetReadiness
      summary: Check application readiness
      responses:
        "200":
          description: Application is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessAPIResponse"
        "503":
          description: Application is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessAPIResponse"
  /auth/register:
    post:
      tags:
        - auth
      operationId: Register
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentialRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserAPIResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      tags:
        - auth
      operationId: Login
      summary: Login and get access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentialRequest"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginAPIResponse"
        "401":
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      tags:
        - auth
      operationId: GetMe
      summary: Get current user from access token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserAPIResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /test_db:
    post:
      tags:
        - test_db
      operationId: CreateTestDB
      summary: Create test table row
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestDBRequest"
      responses:
        "201":
          description: Row created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestDBAPIResponse"
    get:
      tags:
        - test_db
      operationId: GetTestDBList
      summary: Get all test table rows
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number, starts from 1.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Number of rows per page.
        - name: order_by
          in: query
          required: false
          schema:
            type: string
            enum:
              - id_test
              - desc_test
            default: id_test
          description: Column used for sorting.
        - name: order_dir
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
          description: Sort direction.
      responses:
        "200":
          description: Paginated row list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestDBListResponse"
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /test_db/{id_test}:
    get:
      tags:
        - test_db
      operationId: GetTestDBByID
      summary: Get test table row by id
      security:
        - bearerAuth: []
      parameters:
        - name: id_test
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Row detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestDBAPIResponse"
        "404":
          description: Row not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - test_db
      operationId: UpdateTestDB
      summary: Update test table row
      security:
        - bearerAuth: []
      parameters:
        - name: id_test
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestDBRequest"
      responses:
        "200":
          description: Row updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestDBAPIResponse"
        "404":
          description: Row not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - test_db
      operationId: DeleteTestDB
      summary: Delete test table row
      security:
        - bearerAuth: []
      parameters:
        - name: id_test
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Row deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyAPIResponse"
        "404":
          description: Row not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthCredentialRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: rizki
        password:
          type: string
          format: password
          minLength: 8
          example: secret123
    AuthUserResponse:
      type: object
      required:
        - id_user
        - username
        - role
      properties:
        id_user:
          type: string
          format: uuid
        username:
          type: string
          example: rizki
        role:
          type: string
          example: user
    AuthUserAPIResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/AuthUserResponse"
    LoginResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
    LoginAPIResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/LoginResponse"
    HealthResponse:
      type: object
      required:
        - status
        - service
        - env
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: homework
        env:
          type: string
          example: local
    ReadinessResponse:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          example: ready
        checks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ReadinessCheck"
    ReadinessCheck:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ready
        message:
          type: string
          example: database configuration is present
    HealthAPIResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/HealthResponse"
    ReadinessAPIResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/ReadinessResponse"
    TestDBRequest:
      type: object
      properties:
        desc_test:
          type: string
          nullable: true
    TestDBResponse:
      type: object
      required:
        - id_test
      properties:
        id_test:
          type: string
          format: uuid
        desc_test:
          type: string
          nullable: true
    TestDBAPIResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/TestDBResponse"
    TestDBListResponse:
      type: object
      required:
        - code
        - message
        - data
        - meta
      properties:
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: success
        data:
          type: array
          items:
            $ref: "#/components/schemas/TestDBResponse"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    PaginationMeta:
      type: object
      required:
        - page
        - limit
        - total
        - total_pages
        - order_by
        - order_dir
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          format: int64
          example: 25
        total_pages:
          type: integer
          example: 3
        order_by:
          type: string
          example: id_test
        order_dir:
          type: string
          example: asc
    EmptyAPIResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: deleted
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: ERR_BAD_REQUEST
        message:
          type: string
          example: invalid request body
