openapi: 3.0.3
info:
  title: Homework API
  version: 1.0.0
servers:
  - url: /
paths:
  /health:
    get:
      tags:
        - health
      operationId: GetHealth
      summary: Check application liveness
      responses:
        "200":
          description: Application is alive
  /readiness:
    get:
      tags:
        - health
      operationId: GetReadiness
      summary: Check application readiness
      responses:
        "200":
          description: Application is ready
        "503":
          description: Application is not ready
  /test_db:
    post:
      tags:
        - test_db
      operationId: CreateTestDB
      summary: Create test table row
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestDBRequest"
      responses:
        "201":
          description: Row created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestDBResponse"
    get:
      tags:
        - test_db
      operationId: GetTestDBList
      summary: Get all test table rows
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number, starts from 1.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Number of rows per page.
        - name: order_by
          in: query
          required: false
          schema:
            type: string
            enum:
              - id_test
              - desc_test
            default: id_test
          description: Column used for sorting.
        - name: order_dir
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
          description: Sort direction.
      responses:
        "200":
          description: Paginated row list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestDBListResponse"
        "400":
          description: Invalid query parameter
  /test_db/{id_test}:
    get:
      tags:
        - test_db
      operationId: GetTestDBByID
      summary: Get test table row by id
      parameters:
        - name: id_test
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Row detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestDBResponse"
        "404":
          description: Row not found
    put:
      tags:
        - test_db
      operationId: UpdateTestDB
      summary: Update test table row
      parameters:
        - name: id_test
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestDBRequest"
      responses:
        "200":
          description: Row updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestDBResponse"
        "404":
          description: Row not found
    delete:
      tags:
        - test_db
      operationId: DeleteTestDB
      summary: Delete test table row
      parameters:
        - name: id_test
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Row deleted
        "404":
          description: Row not found
components:
  schemas:
    TestDBRequest:
      type: object
      properties:
        desc_test:
          type: string
          nullable: true
    TestDBResponse:
      type: object
      required:
        - id_test
      properties:
        id_test:
          type: string
          format: uuid
        desc_test:
          type: string
          nullable: true
    TestDBListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TestDBResponse"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    PaginationMeta:
      type: object
      required:
        - page
        - limit
        - total
        - total_pages
        - order_by
        - order_dir
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          format: int64
          example: 25
        total_pages:
          type: integer
          example: 3
        order_by:
          type: string
          example: id_test
        order_dir:
          type: string
          example: asc
